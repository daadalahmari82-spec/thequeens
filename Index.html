<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Activity Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      color: #333;
    }
    #activity {
      font-size: 1.2rem;
      color: #007bff;
      margin: 20px 0;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>What should you do today?</h1>
    <div id="activity">Click the button to get an activity!</div>
    <button onclick="generateActivity()">Generate Activity</button>
  </div>

  <script>
    const activities = [
      "Go for a 20-minute walk outside 🏃",
      "Read a chapter of a book 📖",
      "Try learning a new recipe 👨‍🍳",
      "Listen to a new podcast episode 🎙️",
      "Organize your workspace or desk 🧹",
      "Practice 10 minutes of meditation 🧘",
      "Write down 3 things you're grateful for 📝",
      "Stretch or do light yoga 🧘‍♀️",
      "Call or text an old friend 📱"
    ];

    function generateActivity() {
      const randomIndex = Math.floor(Math.random() * activities.length);
      document.getElementById('activity').textContent = activities[randomIndex];
    }
  </script>

</body>
</html>
